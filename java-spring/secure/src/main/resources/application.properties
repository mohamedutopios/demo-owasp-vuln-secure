# A02 - Security Misconfiguration : configuration durcie
server.port=8080
spring.datasource.url=jdbc:h2:mem:taskforge;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false

# Aucune trace ni message technique renvoye au client
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

# Console H2 desactivee
spring.h2.console.enabled=false

# Actuator : seul health est expose, sans detail
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# A04 - secrets fournis par l'environnement (valeurs de secours pour le lab uniquement).
# En production : definir APP_ENC_PASSWORD / APP_ENC_SALT via l'environnement et retirer les defauts.
app.enc.password=${APP_ENC_PASSWORD:dev-lab-password-change-me}
app.enc.salt=${APP_ENC_SALT:5c0744940b5c369b}
