{% extends "base.html" %}
{% block content %}
<h1>Connexion</h1>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Identifiant</label><input name="username" autocomplete="username">
  <label>Mot de passe</label><input type="password" name="password" autocomplete="current-password">
  <button class="primary" type="submit">Se connecter</button>
</form>
<p><a href="/register">Creer un compte</a> &middot; <a href="/reset">Mot de passe oublie ?</a></p>
{% endblock %}
