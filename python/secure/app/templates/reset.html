{% extends "base.html" %}
{% block content %}
<h1>Reinitialiser le mot de passe</h1>
{% if message %}<p>{{ message }}</p>{% endif %}
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Adresse / identifiant</label><input name="email">
  <button class="primary" type="submit">Envoyer</button>
</form>
{% endblock %}
