<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>TaskForge</title>
  <style>
    body{font-family:system-ui,Arial,sans-serif;margin:0;background:#f4f6f8;color:#1f2933}
    header{background:#1f3a5f;color:#fff;padding:12px 24px;display:flex;justify-content:space-between;align-items:center}
    header a{color:#cfe0f5;text-decoration:none;margin-left:16px}
    header button{background:none;border:0;color:#cfe0f5;cursor:pointer;font:inherit;margin-left:16px}
    main{max-width:880px;margin:24px auto;background:#fff;padding:24px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
    input,textarea{width:100%;padding:8px;margin:6px 0;border:1px solid #cbd2d9;border-radius:4px;box-sizing:border-box}
    button.primary{background:#2f6fb0;color:#fff;border:0;padding:9px 16px;border-radius:4px;cursor:pointer}
    table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid #e4e7eb}
    .card{border:1px solid #e4e7eb;border-radius:6px;padding:12px;margin:10px 0}
    .err{color:#b91c1c}
  </style>
</head>
<body>
<header>
  <div><strong>TaskForge</strong></div>
  <nav>
    {% if user %}
      <a href="/tasks">Mes taches</a>
      {% if user["role"] == "ADMIN" %}<a href="/admin/users">Administration</a>{% endif %}
      <form method="post" action="/logout" style="display:inline">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit">Deconnexion</button>
      </form>
    {% endif %}
  </nav>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
