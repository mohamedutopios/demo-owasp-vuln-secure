{% extends "base.html" %}
{% block content %}
<h1>Connexion</h1>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<form method="post">
  <label>Identifiant</label><input name="username">
  <label>Mot de passe</label><input type="password" name="password">
  <label><input type="checkbox" name="remember" style="width:auto"> Se souvenir de moi</label>
  <button type="submit">Se connecter</button>
</form>
<p><a href="/register">Creer un compte</a> &middot; <a href="/reset">Mot de passe oublie ?</a></p>
{% endblock %}
