# TaskForge - lab OWASP Top 10:2025
# Lance les quatre applications (2 vulnerables, 2 conformes).
#
#   Vulnerables :  python-vuln  http://localhost:5050    java-vuln  http://localhost:8080
#   Conformes   :  python-secure http://localhost:5001   java-secure http://localhost:8081
#
# AVERTISSEMENT : les services *-vuln sont volontairement faillibles et embarquent
# des dependances a CVE connues. A n'utiliser que sur un poste isole (reseau interne
# du lab), jamais expose sur Internet.
services:
  python-vuln:
    build: ./python/vulnerable
    ports: ["5050:5000"]   # hote 5050 (5000 est pris par le recepteur AirPlay de macOS)

  # python-secure:
  #   build: ./python/secure
