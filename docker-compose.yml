  #     TASKFORGE_ENC_KEY: "cE9mZ0hJal9rTG1Ob1BxUnN0VXZXeFlaMDEyMzQ1Njc="

  java-vuln:
    build: ./java-spring/vulnerable
    ports: ["8080:8080"]

